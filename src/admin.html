               aria-labelledby="admin-borrowing-tab" tabindex="0">

            <p class="text-body-secondary mb-0">ตรวจคำขอ ส่งมอบ และตรวจรับคืนตามลำดับสถานะ</p>
          </div>
        </div>

        <div id="admin-borrow-quick-filters" class="d-flex gap-2 overflow-x-auto pb-2 mb-2" role="group"

                  data-status="PENDING_APPROVAL" aria-pressed="true">รออนุมัติ</button>
          <button type="button" class="btn btn-sm btn-outline-primary text-nowrap" data-action="filter-admin-borrow"

              <input id="admin-borrow-search" name="search" type="search" class="form-control" autocomplete="off"
                     aria-describedby="admin-borrow-search-help">

            </div>
            <div>
              <label for="admin-borrow-status" class="form-label">สถานะ</label>
              <select id="admin-borrow-status" name="status" class="form-select">
                <option value="">ทุกสถานะ</option>
                <option value="PENDING_APPROVAL">รออนุมัติ</option>
                <option value="APPROVED">อนุมัติแล้ว</option>
                <option value="CHECKED_OUT">ส่งมอบแล้ว</option>
                <option value="RETURN_REQUESTED">แจ้งคืนแล้ว</option>
                <option value="OVERDUE">เกินกำหนด</option>
                <option value="RETURNED">คืนเรียบร้อย</option>
                <option value="REJECTED">ไม่อนุมัติ</option>
              </select>
            </div>
            <div>
              <label for="admin-borrow-sort" class="form-label">เรียงตาม</label>
              <select id="admin-borrow-sort" name="sortBy" class="form-select">
                <option value="requested_at">เวลาส่งคำขอ</option>
                <option value="due_date">กำหนดคืน</option>
                <option value="borrow_date">วันที่ยืม</option>
                <option value="status">สถานะ</option>
                <option value="asset_name">ชื่ออุปกรณ์</option>
                <option value="user_name">ชื่อผู้ยืม</option>

              <button type="submit" class="btn btn-primary">แสดงรายการ</button>

        <div id="admin-borrow-empty" class="card card-body py-5 text-center text-body-secondary d-none"

                  <th scope="col" class="text-end">การทำงาน</th>
                </tr>
              </thead>

          </div>

          </div>

                <p class="mb-3">เลือกอุปกรณ์จากหน้ารายการเพื่อดูรายละเอียด อุปกรณ์ประกอบ และคำสั่งสำหรับผู้ดูแลระบบ</p>
                <button type="button" class="btn btn-outline-primary" data-route="equipment">ไปหน้ารายการอุปกรณ์</button>
              </div>
            </div>

      <section id="admin-users" class="tab-pane fade" role="tabpanel"

          </button>
        </div>
        <form id="form-admin-user-filter" class="card card-body mb-4" novalidate>
          <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-5">

              <input id="admin-user-search" name="search" type="search" class="form-control" autocomplete="off">
            </div>
            <div class="col-6 col-md-4 col-lg-2">

              <button type="reset" class="btn btn-outline-secondary" data-action="clear-admin-user-filter">ล้าง</button>
