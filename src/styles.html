  }

  .status-badge[data-status="AVAILABLE"],

    border-color: var(--crs-warning-border);

  .status-badge[data-status="APPROVED"],

    background: var(--crs-info-bg);
    border-color: var(--crs-info-border);

  .pagination {

  .toast-icon-danger {
    color: var(--crs-danger);
    background: var(--crs-danger-bg);
  }

  .toast-icon-warning {
    color: var(--crs-warning);
    background: var(--crs-warning-bg);
  }

  .toast-icon-info {
    color: var(--crs-info);

  }

  .account-panel-header {

    align-items: center;

  }

  .account-panel-avatar {
    display: grid;
    width: 64px;
    height: 64px;
    flex: 0 0 auto;
    place-items: center;
    border-radius: 50%;
    color: var(--crs-primary-dark);
    background: var(--crs-primary-soft);
    font-size: 1.1rem;
    font-weight: 700;
  }

  .avatar {
    display: inline-grid;

    height: 40px;

    place-items: center;
    border-radius: 50%;

  .list-divider > * + * {

  .text-secondary,
  .text-body-secondary,
  .text-muted {
    color: var(--crs-muted) !important;
  }

  .text-primary {
    color: var(--crs-link) !important;
  }

  .text-danger {
    color: var(--crs-danger) !important;
  }

  .text-success {
    color: var(--crs-success) !important;
  }

  @media (min-width: 768px) {

  @media (min-width: 992px) {

      grid-template-columns: minmax(0, 5fr) minmax(0, 3fr) minmax(0, 2fr) minmax(0, 2fr);

    .borrowing-filter-search {

    .app-content-column {

    .app-shell.is-sidebar-collapsed .account-summary {

    }
  }

  @media (max-width: 1199.98px) {
    .metric-grid,
    .equipment-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 991.98px) {
    .account-popover,
    .account-submenu {
      top: auto !important;
      right: 0.5rem !important;
      bottom: calc(0.5rem + env(safe-area-inset-bottom)) !important;
      left: 0.5rem !important;
      width: auto;
      max-height: calc(100dvh - 1rem - env(safe-area-inset-bottom));

  @media (max-width: 767.98px) {

      align-items: stretch;
      flex-direction: column;

    .page-actions > .btn {
      flex: 1 1 auto;
    }

    .definition-grid {
      grid-template-columns: 1fr;
    }

    .table-responsive {
      margin-inline: -1rem;
    }

    .table > :not(caption) > * > * {
      padding: 0.75rem;
    }

    .modal-dialog {
      margin: 0.75rem;
    }
  }

  @media (max-width: 575.98px) {

      --crs-topbar-height: 68px;
    }

    .app-topbar {
      padding-inline: 0.85rem;
    }

    .app-main {
      padding: 0.9rem 0.85rem calc(var(--crs-mobile-nav-height) + env(safe-area-inset-bottom) + 1rem);
    }

    .metric-grid,
    .equipment-grid {
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .metric-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));

    .metric-card {
      padding: 0.85rem;

    .metric-card-value {
      font-size: 1.45rem;

    .topbar-mobile-brand {
      display: none;
    }

    .mobile-nav-link {
      font-size: 0.6rem;
    }

      inset: 0.75rem 0.75rem auto !important;

  @media (max-width: 767.98px) {
    .settings-page {
      display: block;
    }

    .settings-sidebar {
      position: fixed;
      z-index: 1202;
      top: 0;
      left: 0;
      width: min(18rem, calc(100vw - 2rem));
      height: 100dvh;
      box-shadow: var(--crs-shadow);
      transform: translateX(-105%);
      transition: transform 180ms ease;

    }

    .settings-page.is-sidebar-collapsed .settings-nav-search {
      display: flex;
    }

    .settings-option-card {
      align-items: flex-start;
      flex-direction: column;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  #page-scan {
    max-width: 42rem;
  }

  .scan-hero-icon {
    display: inline-grid;
    width: 4.5rem;
    height: 4.5rem;
    place-items: center;
    border-radius: 1.25rem;
