<script>
(function (global) {
  'use strict';

  const AUTH_SESSION_STORAGE_KEY = 'crs.auth.session.v1';
  const AUTH_REMEMBER_STORAGE_KEY = 'crs.auth.remember.v1';
  const AUTH_SESSION_TOKEN_PATTERN = /^session1_[A-Za-z0-9_-]{43}$/;
  const AUTH_SESSION_MAX_SECONDS = 21600;

  class ClientApiError extends Error {
    constructor(error, requestId) {
      const source = error || {};
      super(source.message || 'ไม่สามารถดำเนินการได้ กรุณาลองใหม่อีกครั้ง');
      this.name = 'ClientApiError';
      this.code = source.code || 'INTERNAL';
      this.fieldErrors = source.fieldErrors || null;
      this.retryable = source.retryable !== false;
      this.requestId = requestId || '';
    }
  }

  const authState = {
    sessionToken: '',
    sessionExpiresAt: 0,
    initialized: false,
    attempt: null,
    generation: 0,
    sessionPromise: null,
    sessionResolve: null,
    sessionReject: null
  };

  function storageGet(storage, key) {
    try { return storage.getItem(key); }
    catch (error) { return null; }
  }

  function storageSet(storage, key, value) {
    try { storage.setItem(key, value); return true; }
    catch (error) { return false; }
  }

  function storageRemove(storage, key) {
    try { storage.removeItem(key); }
    catch (error) { /* Storage denial is already fail closed in memory. */ }
  }

  function parseStoredSession(serialized) {
    if (!serialized) return null;
    let record;
    try { record = JSON.parse(serialized); }
    catch (error) { return null; }
    const nowSeconds = Math.floor(Date.now() / 1000);
    if (!record || record.version !== 1 ||
      !AUTH_SESSION_TOKEN_PATTERN.test(String(record.token || '')) ||
      !Number.isInteger(record.expiresAt) || record.expiresAt <= nowSeconds ||
      record.expiresAt > nowSeconds + AUTH_SESSION_MAX_SECONDS + 60) return null;
    return { version: 1, token: record.token, expiresAt: record.expiresAt };
  }

  function clearStoredSession() {
    storageRemove(global.localStorage, AUTH_SESSION_STORAGE_KEY);
    storageRemove(global.sessionStorage, AUTH_SESSION_STORAGE_KEY);
  }

  function restoreStoredSession() {
    const persistentRaw = storageGet(global.localStorage, AUTH_SESSION_STORAGE_KEY);
    const persistent = parseStoredSession(persistentRaw);
    if (persistent) {
      storageRemove(global.sessionStorage, AUTH_SESSION_STORAGE_KEY);
      return persistent;
    }
    if (persistentRaw) storageRemove(global.localStorage, AUTH_SESSION_STORAGE_KEY);

    const transientRaw = storageGet(global.sessionStorage, AUTH_SESSION_STORAGE_KEY);
    const transient = parseStoredSession(transientRaw);
    if (transient) return transient;
    if (transientRaw) storageRemove(global.sessionStorage, AUTH_SESSION_STORAGE_KEY);
    return null;
  }

  function persistApplicationSession(token, expiresAt, remember) {
    const record = parseStoredSession(JSON.stringify({
      version: 1,
      token: token,
      expiresAt: Number(expiresAt)
    }));
    if (!record) throw new ClientApiError({
      code: 'AUTH_PROTOCOL_ERROR',
      message: 'ระบบได้รับอายุ session ไม่ถูกต้อง กรุณาลงชื่อเข้าใช้ใหม่',
      retryable: false
    });
    clearStoredSession();
    const target = remember ? global.localStorage : global.sessionStorage;
    if (!storageSet(target, AUTH_SESSION_STORAGE_KEY, JSON.stringify(record))) {
      throw new ClientApiError({
        code: 'CLIENT_STORAGE_UNAVAILABLE',
        message: 'เบราว์เซอร์ไม่อนุญาตให้จดจำ session กรุณาตรวจการตั้งค่าความเป็นส่วนตัว',
        retryable: true
      });
    }
  }

  function initializeRememberSessionControl() {
    const checkbox = document.querySelector('#remember-session');
    if (!checkbox) return;
    checkbox.checked = storageGet(global.localStorage, AUTH_REMEMBER_STORAGE_KEY) === 'true';
    checkbox.addEventListener('change', function () {
      storageSet(global.localStorage, AUTH_REMEMBER_STORAGE_KEY, checkbox.checked ? 'true' : 'false');
    });
  }

  function showGoogleSignIn(message) {
    const splash = document.querySelector('#app-splash');
    const shell = document.querySelector('#app-shell');
    const access = document.querySelector('#access-state');
    if (splash) splash.hidden = true;
    if (shell) shell.hidden = true;
    if (access) access.hidden = false;
    const title = access && access.querySelector('[data-access-title]');
    const detail = access && access.querySelector('[data-access-message]');
    const requestId = access && access.querySelector('[data-access-request-id]');
    if (title) title.textContent = 'ลงชื่อเข้าใช้ด้วย Google';
    if (detail) detail.textContent = message ||
      'เลือกบัญชี Google ที่ได้รับอนุญาตให้ใช้ระบบ';
    if (requestId) requestId.textContent = '';
    setSignInBusy(false);
  }

  function setSignInBusy(busy) {
    const button = document.querySelector('#google-signin-button');
    const label = button && button.querySelector('[data-auth-button-label]');
    if (button) {
      button.disabled = Boolean(busy);
      button.setAttribute('aria-busy', busy ? 'true' : 'false');
    }
    if (label) label.textContent = busy ? 'กำลังเชื่อมต่อกับ Google…' : 'ลงชื่อเข้าใช้ด้วย Google';
  }

  function otpInputs() {
    return Array.prototype.slice.call(document.querySelectorAll('[data-otp-digit]'));
  }

  function readOtp() {
    return otpInputs().map(function (input) { return input.value; }).join('');
  }

  function setOtpError(message) {
    const error = document.querySelector('#oauth-handoff-error');
    if (!error) return;
    error.textContent = String(message || '');
    error.hidden = !error.textContent;
  }

  function updateOtpSubmit() {
    const submit = document.querySelector('#oauth-handoff-submit');
    if (submit) submit.disabled = !/^\d{6}$/.test(readOtp());
  }

  function clearOtpInputs(focusFirst) {
    const inputs = otpInputs();
    inputs.forEach(function (input) {
      input.value = '';
      input.setCustomValidity('');
    });
    setOtpError('');
    updateOtpSubmit();
    if (focusFirst && inputs[0]) inputs[0].focus();
  }

  function distributeOtp(text, focusLast) {
    const digits = normalizeOtp(text).slice(0, 6);
    const inputs = otpInputs();
    inputs.forEach(function (input, index) { input.value = digits.charAt(index) || ''; });
    setOtpError('');
    updateOtpSubmit();
    if (inputs.length) {
      const focusIndex = focusLast && digits.length === 6
        ? 5
        : Math.min(digits.length, 5);
      inputs[focusIndex].focus();
    }
  }

  function initializeOtpInputs() {
    const inputs = otpInputs();
    inputs.forEach(function (input, index) {
      input.addEventListener('beforeinput', function (event) {
        const digits=normalizeOtp(event.data || (event.dataTransfer && event.dataTransfer.getData('text')));
        if(digits.length===6) {event.preventDefault();distributeOtp(digits,true);}
      });
      input.addEventListener('input', function () {
        const digits = normalizeOtp(input.value);
        if (digits.length > 1) {
          distributeOtp(digits, true);
          return;
        }
        input.value = digits;
        setOtpError('');
        updateOtpSubmit();
        if (digits && inputs[index + 1]) inputs[index + 1].focus();
      });
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && /^\d{6}$/.test(readOtp())) {
          event.preventDefault();
          document.querySelector('#oauth-handoff-submit').click();
        } else if (event.key === 'Backspace' && !input.value && inputs[index - 1]) {
          event.preventDefault();
          inputs[index - 1].value = '';
          inputs[index - 1].focus();
          updateOtpSubmit();
        } else if (event.key === 'ArrowLeft' && inputs[index - 1]) {
          event.preventDefault();
          inputs[index - 1].focus();
        } else if (event.key === 'ArrowRight' && inputs[index + 1]) {
          event.preventDefault();
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('paste', function (event) {
        const pasted = event.clipboardData && event.clipboardData.getData('text');
        if (normalizeOtp(pasted).length !== 6) return;
        event.preventDefault();
        distributeOtp(pasted, true);
      });
    });
  }

  function initializeServerOAuth() {
    if (authState.initialized) return;
    const button = document.querySelector('#google-signin-button');
    if (!button) return;
    initializeRememberSessionControl();
    const restored = restoreStoredSession();
    if (restored) {
      authState.sessionToken = restored.token;
      authState.sessionExpiresAt = restored.expiresAt;
    }
    initializeOtpInputs();
    button.addEventListener('click', startOAuthSignIn);
    document.querySelector('#oauth-handoff-submit').addEventListener('click', function () {
      if (!authState.attempt) return;
      const inputs = otpInputs();
      const code = readOtp();
      if (!/^\d{6}$/.test(code)) {
        setOtpError('กรุณากรอกรหัสตัวเลขให้ครบ 6 หลัก');
        if (inputs[0]) {
          inputs[0].setCustomValidity('กรุณากรอกรหัสตัวเลขให้ครบ 6 หลัก');
          inputs[0].reportValidity();
          inputs[0].focus();
        }
        return;
      }
      inputs.forEach(function (input) { input.setCustomValidity(''); });
      setOtpError('');
      authState.attempt.handoffCode = code;
      clearOtpInputs(false);
    });
    authState.initialized = true;
  }

  function normalizeOtp(text) {
    return String(text || '').normalize('NFKC').replace(/[๐-๙]/g,function(digit){return String(digit.charCodeAt(0)-0x0e50);})
      .replace(/[٠-٩]/g,function(digit){return String(digit.charCodeAt(0)-0x0660);})
      .replace(/[۰-۹]/g,function(digit){return String(digit.charCodeAt(0)-0x06f0);}).replace(/\D/g,'');
  }

  async function passwordSignIn(email, password) {
    initializeServerOAuth();
    if (authState.sessionToken || authState.attempt) throw new ClientApiError({code:'AUTH_BUSY',message:'กรุณาจบการลงชื่อเข้าใช้เดิมก่อน'});
    const attempt={generation:++authState.generation};
    authState.attempt=attempt;
    setSignInBusy(true);
    try {
      const token=randomBrowserSecret('session1_');
      const result=await serverRpc('passwordSignIn',[{email:email,password:password,sessionTokenHash:await sha256BrowserSecret(token)}]);
      if(authState.attempt!==attempt || attempt.generation!==authState.generation) return;
      if(result.status!=='COMPLETE') throw new ClientApiError({code:'AUTH_PROTOCOL_ERROR'});
      const remember=document.querySelector('#remember-session');
      persistApplicationSession(token,result.expiresAt,Boolean(remember && remember.checked));
      authState.sessionToken=token;authState.sessionExpiresAt=result.expiresAt;
      const waiting=Boolean(authState.sessionResolve);
      settleSessionWaiter(null,token);
      if(!waiting) global.dispatchEvent(new CustomEvent('crs:authentication-required'));
      return result;
    } finally {
      if(authState.attempt===attempt) {authState.attempt=null;setSignInBusy(false);}
    }
  }

  function serverRpc(method, args) {
    return new Promise(function (resolve, reject) {
      if (!global.google || !google.script || !google.script.run) {
        reject(new ClientApiError({
          code: 'CLIENT_ENVIRONMENT',
          message: 'กรุณาเปิดระบบผ่านลิงก์ Web app ขององค์กร',
          retryable: false
        }));
        return;
      }
      const runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.ok === true) {
            resolve(response.data);
            return;
          }
          reject(new ClientApiError(
            response && response.error,
            response && response.meta && response.meta.requestId
          ));
        })
        .withFailureHandler(function (error) {
          console.error('google.script.run transport failure');
          reject(new ClientApiError({
            code: 'TRANSPORT_ERROR',
            message: 'เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่',
            retryable: true
          }));
        });
      try {
        runner[method].apply(runner, args || []);
      } catch (error) {
        reject(new ClientApiError({
          code: 'CLIENT_ERROR',
          message: 'ไม่สามารถส่งคำขอไปยังระบบได้ กรุณาลองใหม่',
          retryable: true
        }));
      }
    });
  }

  function randomBrowserSecret(prefix) {
    if (!global.crypto || typeof global.crypto.getRandomValues !== 'function') {
      throw new ClientApiError({
        code: 'CLIENT_SECURITY_UNAVAILABLE',
        message: 'เบราว์เซอร์นี้ไม่รองรับการลงชื่อเข้าใช้อย่างปลอดภัย กรุณาอัปเดตเบราว์เซอร์',
        retryable: false
      });
    }
    const bytes = new Uint8Array(32);
    global.crypto.getRandomValues(bytes);
    let binary = '';
    bytes.forEach(function (byte) { binary += String.fromCharCode(byte); });
    return prefix + global.btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  async function sha256BrowserSecret(value) {
    if (!global.crypto || !global.crypto.subtle || typeof global.crypto.subtle.digest !== 'function' ||
      typeof global.TextEncoder !== 'function') {
      throw new ClientApiError({
        code: 'CLIENT_SECURITY_UNAVAILABLE',
        message: 'เบราว์เซอร์นี้ไม่รองรับการลงชื่อเข้าใช้อย่างปลอดภัย กรุณาอัปเดตเบราว์เซอร์',
        retryable: false
      });
    }
    const digest = await global.crypto.subtle.digest(
      'SHA-256',
      new global.TextEncoder().encode(String(value))
    );
    let binary = '';
    new Uint8Array(digest).forEach(function (byte) { binary += String.fromCharCode(byte); });
    return global.btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  function validateAuthorizationStart(value) {
    const start = value && typeof value === 'object' ? value : {};
    const flowId = String(start.flowId || '');
    const authorizationUrl = String(start.authorizationUrl || '');
    const expiresAt = Number(start.expiresAt);
    let parsed;
    try { parsed = new URL(authorizationUrl); }
    catch (error) { parsed = null; }
    const forbiddenParameters = parsed && [
      'access_token', 'id_token', 'refresh_token', 'session_token'
    ].some(function (name) { return parsed.searchParams.has(name); });
    if (!/^flow1_[A-Za-z0-9_-]{43}$/.test(flowId) ||
      !Number.isInteger(expiresAt) || expiresAt <= Math.floor(Date.now() / 1000) ||
      !parsed || parsed.origin !== 'https://accounts.google.com' ||
      parsed.pathname !== '/o/oauth2/v2/auth' || !parsed.searchParams.get('state') ||
      forbiddenParameters) {
      throw new ClientApiError({
        code: 'AUTH_PROTOCOL_ERROR',
        message: 'ระบบส่งข้อมูลเริ่มต้นการลงชื่อเข้าใช้ไม่ถูกต้อง กรุณาติดต่อผู้ดูแลระบบ',
        retryable: false
      });
    }
    return { flowId: flowId, authorizationUrl: authorizationUrl, expiresAt: expiresAt };
  }

  function sessionWaiter() {
    if (authState.sessionToken) return Promise.resolve(authState.sessionToken);
    if (!authState.sessionPromise) {
      authState.sessionPromise = new Promise(function (resolve, reject) {
        authState.sessionResolve = resolve;
        authState.sessionReject = reject;
      });
    }
    return authState.sessionPromise;
  }

  function settleSessionWaiter(error, sessionToken) {
    const resolve = authState.sessionResolve;
    const reject = authState.sessionReject;
    authState.sessionPromise = null;
    authState.sessionResolve = null;
    authState.sessionReject = null;
    if (error && reject) reject(error);
    else if (!error && resolve) resolve(sessionToken);
  }

  function delay(milliseconds) {
    return new Promise(function (resolve) { global.setTimeout(resolve, milliseconds); });
  }

  async function pollOAuthAttempt(attempt) {
    let closedAt = 0;
    while (authState.attempt === attempt && authState.generation === attempt.generation) {
      if (Math.floor(Date.now() / 1000) >= attempt.expiresAt) {
        throw new ClientApiError({
          code: 'UNAUTHENTICATED',
          message: 'คำขอลงชื่อเข้าใช้หมดอายุแล้ว กรุณาลองใหม่',
          retryable: true
        });
      }
      if (attempt.popup.closed && document.querySelector('#oauth-handoff-panel').hidden) {
        if (!closedAt) closedAt = Date.now();
        if (Date.now() - closedAt > 1500) {
          throw new ClientApiError({
            code: 'AUTH_CANCELLED',
            message: 'หน้าต่างลงชื่อเข้าใช้ถูกปิด กรุณาลองใหม่',
            retryable: true
          });
        }
      }
      const handoff = attempt.handoffCode || '';
      attempt.handoffCode = '';
      let result;
      try {
        result = await serverRpc('completeOAuthSignIn',
          [attempt.flowId, attempt.pollToken, handoff, handoff ? attempt.sessionToken : '']);
      } catch (error) {
        if (handoff && error instanceof ClientApiError && error.code === 'OTP_INVALID') {
          setOtpError(error.message || 'รหัสยืนยันไม่ถูกต้อง กรุณาลองอีกครั้ง');
          const firstOtpInput = otpInputs()[0];
          if (firstOtpInput) firstOtpInput.focus();
          await delay(250);
          continue;
        }
        throw error;
      }
      if (result && result.status === 'AWAITING_CONFIRMATION') {
        if (result.closePopup && attempt.popup && !attempt.popup.closed) {
          try { attempt.popup.close(); }
          catch (ignored) { /* The OTP can still be entered if popup close is blocked. */ }
        }
        const panel = document.querySelector('#oauth-handoff-panel');
        if (panel && panel.hidden) {
          panel.hidden = false;
          clearOtpInputs(true);
        }
        await delay(750);
        continue;
      }
      if (result && result.status === 'COMPLETE') {
        const sessionExpiresAt = Number(result.expiresAt);
        if (!Number.isInteger(sessionExpiresAt) ||
          sessionExpiresAt <= Math.floor(Date.now() / 1000) ||
          sessionExpiresAt > Math.floor(Date.now() / 1000) + AUTH_SESSION_MAX_SECONDS + 60) {
          throw new ClientApiError({
            code: 'AUTH_PROTOCOL_ERROR',
            message: 'ระบบได้รับอายุ session ไม่ถูกต้อง กรุณาลงชื่อเข้าใช้ใหม่',
            retryable: false
          });
        }
        attempt.sessionExpiresAt = sessionExpiresAt;
        return;
      }
      if (!result || result.status !== 'PENDING') {
        throw new ClientApiError({
          code: 'AUTH_PROTOCOL_ERROR',
          message: 'สถานะการลงชื่อเข้าใช้ไม่ถูกต้อง กรุณาลองใหม่',
          retryable: true
        });
      }
      await delay(750);
    }
    throw new ClientApiError({
      code: 'AUTH_CANCELLED',
      message: 'คำขอลงชื่อเข้าใช้ถูกยกเลิก',
      retryable: true
    });
  }

  async function startOAuthSignIn() {
    if (authState.sessionToken || authState.attempt) return;
    const popup = global.open('', 'crs-google-oauth',
      'popup=yes,width=520,height=720,resizable=yes,scrollbars=yes');
    if (!popup) {
      const blocked = new ClientApiError({
        code: 'POPUP_BLOCKED',
        message: 'เบราว์เซอร์บล็อกหน้าต่างลงชื่อเข้าใช้ กรุณาอนุญาต popup แล้วลองใหม่',
        retryable: true
      });
      showGoogleSignIn(blocked.message);
      settleSessionWaiter(blocked);
      return;
    }

    const generation = ++authState.generation;
    const attempt = {
      generation: generation,
      popup: popup,
      pollToken: '',
      sessionToken: '',
      flowId: '',
      expiresAt: 0
    };
    const rememberControl = document.querySelector('#remember-session');
    attempt.remember = Boolean(rememberControl && rememberControl.checked);
    authState.attempt = attempt;
    document.querySelector('#oauth-handoff-panel').hidden = true;
    clearOtpInputs(false);
    setSignInBusy(true);

    try {
      try {
        popup.document.title = 'กำลังเชื่อมต่อกับ Google';
        popup.document.body.textContent = 'กำลังเตรียมหน้าลงชื่อเข้าใช้…';
        popup.opener = null;
      } catch (ignored) { /* The popup will navigate immediately. */ }

      attempt.pollToken = randomBrowserSecret('poll1_');
      attempt.sessionToken = randomBrowserSecret('session1_');
      const hashes = await Promise.all([
        sha256BrowserSecret(attempt.pollToken),
        sha256BrowserSecret(attempt.sessionToken)
      ]);
      const start = validateAuthorizationStart(await serverRpc('beginOAuthSignIn', [{
        pollTokenHash: hashes[0],
        sessionTokenHash: hashes[1]
      }]));
      if (authState.attempt !== attempt || generation !== authState.generation) return;
      attempt.flowId = start.flowId;
      attempt.expiresAt = start.expiresAt;
      popup.location.replace(start.authorizationUrl);
      await pollOAuthAttempt(attempt);
      if (authState.attempt !== attempt || generation !== authState.generation) return;
      const hadSessionWaiter = Boolean(authState.sessionResolve);
      authState.sessionToken = attempt.sessionToken;
      authState.sessionExpiresAt = attempt.sessionExpiresAt;
      persistApplicationSession(authState.sessionToken, authState.sessionExpiresAt, attempt.remember);
      settleSessionWaiter(null, authState.sessionToken);
      if (!hadSessionWaiter) {
        global.dispatchEvent(new CustomEvent('crs:authentication-required'));
      }
    } catch (error) {
      const normalized = error instanceof ClientApiError ? error : new ClientApiError({
        code: 'AUTH_CLIENT_ERROR',
        message: 'ลงชื่อเข้าใช้ไม่สำเร็จ กรุณาลองใหม่',
        retryable: true
      });
      if (authState.attempt === attempt && generation === authState.generation) {
        showGoogleSignIn(normalized.message);
        settleSessionWaiter(normalized);
      }
    } finally {
      if (authState.attempt === attempt && generation === authState.generation) {
        authState.attempt = null;
        document.querySelector('#oauth-handoff-panel').hidden = true;
        clearOtpInputs(false);
        setSignInBusy(false);
      }
      try { if (!popup.closed) popup.close(); }
      catch (ignored) { /* Cross-origin popup close is best-effort. */ }
    }
  }

  function getSessionToken() {
    if (authState.sessionToken) return Promise.resolve(authState.sessionToken);
    initializeServerOAuth();
    showGoogleSignIn();
    return sessionWaiter();
  }

  function clearSessionToken(expectedToken) {
    if (expectedToken && authState.sessionToken !== expectedToken) return false;
    authState.sessionToken = '';
    authState.sessionExpiresAt = 0;
    clearStoredSession();
    return true;
  }

  async function signOut() {
    const token = authState.sessionToken;
    const activeAttempt = authState.attempt;
    clearSessionToken(token);
    authState.generation += 1;
    authState.attempt = null;
    try {
      if (activeAttempt && activeAttempt.popup && !activeAttempt.popup.closed) {
        activeAttempt.popup.close();
      }
    } catch (ignored) { /* Popup cleanup is best-effort. */ }
    if (token) {
      try { await serverRpc('logoutSession', [token]); }
      catch (error) { console.warn('Server session logout failed closed', error); }
    }
    global.dispatchEvent(new CustomEvent('crs:authentication-required'));
  }

  async function invoke(method, args) {
    const sessionToken = await getSessionToken();
    try {
      return await serverRpc(method, [sessionToken].concat(args || []));
    } catch (error) {
      const identityRejected = error && (error.code === 'UNAUTHENTICATED' ||
        error.code === 'USER_DISABLED' ||
        (method === 'getAppBootstrap' &&
          error.code === 'FORBIDDEN'));
      if (identityRejected) {
        const clearedCurrentToken = clearSessionToken(sessionToken);
        if (clearedCurrentToken && method !== 'getAppBootstrap') {
          global.dispatchEvent(new CustomEvent('crs:authentication-required'));
        }
      }
      throw error;
    }
  }

  function endpoint(method) {
    return function () {
      return invoke(method, Array.prototype.slice.call(arguments));
    };
  }

  document.addEventListener('DOMContentLoaded', initializeServerOAuth);
  global.addEventListener('storage', function (event) {
    if (event.key !== AUTH_SESSION_STORAGE_KEY || event.newValue !== null ||
      !authState.sessionToken) return;
    authState.sessionToken = '';
    authState.sessionExpiresAt = 0;
    storageRemove(global.sessionStorage, AUTH_SESSION_STORAGE_KEY);
    global.dispatchEvent(new CustomEvent('crs:authentication-required'));
  });

  global.CRS.ClientApiError = ClientApiError;

    getSessionToken: getSessionToken,
    clearSessionToken: clearSessionToken,
    showGoogleSignIn: showGoogleSignIn,
    signOut: signOut,
    passwordSignIn: passwordSignIn,
    hasSession: function () { initializeServerOAuth(); return Boolean(authState.sessionToken); },
    requestSecurity: function (method,input) {
      if(['requestPasswordOtp','verifyPasswordOtp','changePassword','adminIssueTemporaryPassword','listNotifications','adminSetEquipmentPublic','adminGetEquipmentVisibility'].indexOf(method)===-1) return Promise.reject(new ClientApiError({code:'NOT_FOUND'}));
      const token=authState.sessionToken;
      return serverRpc(method,[token,input || {}]).catch(function(error){
        if(token && error && ['UNAUTHENTICATED','USER_DISABLED'].indexOf(error.code)!==-1 && clearSessionToken(token)) {
          global.dispatchEvent(new CustomEvent('crs:authentication-required'));
        }
        throw error;
      });
    }
  });
  global.CRS.api = Object.freeze({
    getAppBootstrap: endpoint('getAppBootstrap'),
