<script>
(function (global) {
  'use strict';

  const CRS = global.CRS = global.CRS || {};
  const THEME_STORAGE_KEY = 'crs-theme';
  const DESKTOP_SIDEBAR_STORAGE_KEY = 'crs-desktop-sidebar-collapsed';
  const SIDEBAR_SHORTCUT_STORAGE_KEY = 'crs-sidebar-shortcut-enabled';
  const SIDEBAR_SHORTCUT_BINDING_KEY = 'crs-sidebar-shortcut-binding';
  const DEFAULT_SIDEBAR_BINDING = Object.freeze({ ctrl: true, shift: true, alt: false, meta: false, code: 'KeyS' });
  const THEME_ORDER = ['system', 'light', 'dark'];
  const themeMedia = global.matchMedia ? global.matchMedia('(prefers-color-scheme: dark)') : null;

  function validTheme(value) {
    return THEME_ORDER.indexOf(value) !== -1 ? value : 'system';
  }

  function readThemePreference() {
    try { return validTheme(global.localStorage.getItem(THEME_STORAGE_KEY)); }
    catch (error) { return 'system'; }
  }

  function effectiveTheme(preference) {
    return preference === 'system' ? (themeMedia && themeMedia.matches ? 'dark' : 'light') : preference;
  }

  function updateThemeControls(preference, effective) {
    const labels = {
      system: ['ธีมตามระบบ', 'ตามระบบ', 'light', 'bi-circle-half'],
      light: ['โหมดสว่าง', 'สว่าง', 'dark', 'bi-sun-fill'],
      dark: ['โหมดมืด', 'มืด', 'light', 'bi-moon-stars-fill']
    };
    const nextLabels = { light: 'โหมดสว่าง', dark: 'โหมดมืด', system: 'ตามระบบ' };
    const meta = labels[effective];
    Array.prototype.forEach.call(document.querySelectorAll('[data-action="theme-toggle"]'), function (button) {
      const description = 'ธีม: ' + meta[1] + ' · เปลี่ยนเป็น' + nextLabels[meta[2]];
      button.setAttribute('aria-label', description);
      button.setAttribute('title', description);
      button.setAttribute('aria-pressed', preference === 'system' ? 'mixed' : String(preference === 'dark'));
      button.dataset.themePreference = preference;
      button.dataset.effectiveTheme = effective;
      const icon = button.querySelector('[data-theme-icon]');
      if (icon) icon.className = 'bi ' + meta[3];
      const label = button.querySelector('[data-theme-label]');
      if (label) label.textContent = meta[0];
    });
  }

  function applyTheme(preference, persist) {
    const selected = validTheme(preference);
    const effective = effectiveTheme(selected);
    document.documentElement.dataset.themePreference = selected;
    document.documentElement.setAttribute('data-bs-theme', effective);
    document.documentElement.style.colorScheme = effective;
    const themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) {
      const canvasColor = global.getComputedStyle(document.documentElement)
        .getPropertyValue('--crs-canvas').trim();
      if (canvasColor) themeColor.setAttribute('content', canvasColor);
    }
    if (persist) {
      try { global.localStorage.setItem(THEME_STORAGE_KEY, selected); }
      catch (error) { /* Theme remains active for this page when storage is unavailable. */ }
    }
    updateThemeControls(selected, effective);
  }

  function cycleTheme() {
    const current = validTheme(document.documentElement.dataset.themePreference || readThemePreference());
    applyTheme(effectiveTheme(current) === 'dark' ? 'light' : 'dark', true);
  }

  function isDesktopViewport() {
    return global.matchMedia
      ? global.matchMedia('(min-width: 992px)').matches
      : global.innerWidth >= 992;
  }

  function validSidebarBinding(binding) {
    return binding && typeof binding === 'object' &&
      /^Key[A-Z]$|^Digit[0-9]$/.test(String(binding.code || '')) &&
      (binding.ctrl === true || binding.alt === true || binding.meta === true) &&
      ['ctrl', 'shift', 'alt', 'meta'].every(function (key) { return typeof binding[key] === 'boolean'; });
  }

  function readSidebarBinding() {
    try {
      const saved = JSON.parse(global.localStorage.getItem(SIDEBAR_SHORTCUT_BINDING_KEY));
      if (validSidebarBinding(saved)) return saved;
    } catch (error) { /* Use the default when storage is unavailable or invalid. */ }
    return Object.assign({}, DEFAULT_SIDEBAR_BINDING);
  }

  let sidebarBinding = readSidebarBinding();
  let sidebarShortcutEnabledFallback = true;

  function sidebarBindingLabel(binding) {
    const parts = [];
    if (binding.ctrl) parts.push('Ctrl');
    if (binding.alt) parts.push('Alt');
    if (binding.shift) parts.push('Shift');
    if (binding.meta) parts.push('Meta');
    parts.push(binding.code.replace(/^(?:Key|Digit)/, ''));
    return parts.join(' + ');
  }

  function setDesktopSidebarCollapsed(collapsed, persist) {
    const shell = document.getElementById('app-shell');
    const button = document.getElementById('desktop-sidebar-toggle');
    const brandLink = document.querySelector('#desktop-sidebar .brand-link');
    const header = document.querySelector('#desktop-sidebar .sidebar-header');
    if (!shell) return;

    shell.classList.toggle('is-sidebar-collapsed', collapsed);
    if (brandLink) {
      brandLink.tabIndex = collapsed ? -1 : 0;
      if (collapsed) brandLink.setAttribute('aria-hidden', 'true');
      else brandLink.removeAttribute('aria-hidden');
    }
    if (!collapsed && header) header.classList.remove('is-toggle-revealed');
    if (button) {
      const label = collapsed ? 'ขยายแถบเมนู' : 'ยุบแถบเมนู';
      const description = label + ' (' + sidebarBindingLabel(sidebarBinding) + ')';
      button.setAttribute('aria-pressed', String(collapsed));
      button.setAttribute('aria-label', description);
      button.setAttribute('title', "Toggle sidebar '" + sidebarBindingLabel(sidebarBinding) + "'");
    }

    Array.prototype.forEach.call(shell.querySelectorAll('#desktop-nav .sidebar-link'), function (link) {
      const label = Array.prototype.find.call(link.children, function (child) {
        return child.tagName === 'SPAN' && !child.classList.contains('sidebar-link-indicator');
      });
      if (collapsed && label) {
        const text = label.textContent.trim();
        link.setAttribute('aria-label', text);
        link.setAttribute('title', text);
      } else {
        link.removeAttribute('aria-label');
        link.removeAttribute('title');
      }
    });

    if (persist) {
      try { global.localStorage.setItem(DESKTOP_SIDEBAR_STORAGE_KEY, collapsed ? '1' : '0'); }
      catch (error) { /* Sidebar preference remains active for this page when storage is unavailable. */ }
    }
  }

  function initializeDesktopSidebar() {
    let collapsed = false;
    try { collapsed = global.localStorage.getItem(DESKTOP_SIDEBAR_STORAGE_KEY) === '1'; }
    catch (error) { /* Use the expanded sidebar when storage is unavailable. */ }
    setDesktopSidebarCollapsed(collapsed, false);
  }

  function toggleDesktopSidebar() {
    const shell = document.getElementById('app-shell');
    if (!shell || shell.hidden || !isDesktopViewport()) return;
    setDesktopSidebarCollapsed(!shell.classList.contains('is-sidebar-collapsed'), true);
  }

  function initializeSidebarHeaderReveal() {
    const header = document.querySelector('#desktop-sidebar .sidebar-header');
    const brandLink = header && header.querySelector('.brand-link');
    const brandMark = brandLink && brandLink.querySelector('.brand-mark');
    const button = document.getElementById('desktop-sidebar-toggle');
    if (!header || !brandMark || !button) return;
    brandMark.addEventListener('pointerenter', function () {
      header.classList.add('is-toggle-revealed');
    });
    header.addEventListener('pointerleave', function () {
      if (!button.matches(':focus-visible')) header.classList.remove('is-toggle-revealed');
    });
    button.addEventListener('focus', function () {
      if (button.matches(':focus-visible')) header.classList.add('is-toggle-revealed');
    });
    button.addEventListener('blur', function () {
      if (!header.matches(':hover')) header.classList.remove('is-toggle-revealed');
    });
    brandLink.addEventListener('click', function (event) {
      const shell = document.getElementById('app-shell');
      if (!shell || !shell.classList.contains('is-sidebar-collapsed')) return;
      event.preventDefault();
      event.stopPropagation();
      toggleDesktopSidebar();
    }, true);
  }

  initializeSidebarHeaderReveal();

  CRS.sidebarShortcut = Object.freeze({
    enabled: function () {
      try { return global.localStorage.getItem(SIDEBAR_SHORTCUT_STORAGE_KEY) !== '0'; }
      catch (error) { return sidebarShortcutEnabledFallback; }
    },
    setEnabled: function (enabled) {
      sidebarShortcutEnabledFallback = Boolean(enabled);
      try { global.localStorage.setItem(SIDEBAR_SHORTCUT_STORAGE_KEY, enabled ? '1' : '0'); }
      catch (error) { /* The new setting still works for this page. */ }
    },
    binding: function () { return Object.assign({}, sidebarBinding); },
    label: function () { return sidebarBindingLabel(sidebarBinding); },
    setBinding: function (binding) {
      if (!validSidebarBinding(binding)) return false;
      sidebarBinding = {
        ctrl: binding.ctrl, shift: binding.shift, alt: binding.alt, meta: binding.meta, code: binding.code
      };
      try { global.localStorage.setItem(SIDEBAR_SHORTCUT_BINDING_KEY, JSON.stringify(sidebarBinding)); }
      catch (error) { /* The new binding still works for this page. */ }
      const shell = document.getElementById('app-shell');
      if (shell) setDesktopSidebarCollapsed(shell.classList.contains('is-sidebar-collapsed'), false);
      return true;
    },
    resetBinding: function () {
      this.setBinding(DEFAULT_SIDEBAR_BINDING);
      try { global.localStorage.removeItem(SIDEBAR_SHORTCUT_BINDING_KEY); }
      catch (error) { /* The default still works for this page. */ }
    }
  });

  CRS.theme = Object.freeze({ apply: applyTheme, current: readThemePreference });
  applyTheme(document.documentElement.dataset.themePreference || readThemePreference(), false);
  if (themeMedia) {
    const followSystemTheme = function () {
      if ((document.documentElement.dataset.themePreference || 'system') === 'system') {
        applyTheme('system', false);
      }
    };
    if (typeof themeMedia.addEventListener === 'function') themeMedia.addEventListener('change', followSystemTheme);
    else if (typeof themeMedia.addListener === 'function') themeMedia.addListener(followSystemTheme);
  }
  const LANGUAGE_STORAGE_KEY = 'crs-ui-language';
  const LANGUAGES = Object.freeze([
    { code: 'auto', name: 'Auto detect' },
    { code: 'th', name: 'ไทย' },
    { code: 'en', name: 'English' },
    { code: 'ms', name: 'Bahasa Melayu' },
    { code: 'bs', name: 'bosanski' },
    { code: 'my', name: 'Burmese' },
    { code: 'ca', name: 'català' },
    { code: 'cs', name: 'čeština' },
    { code: 'da', name: 'dansk' },
    { code: 'de', name: 'Deutsch' },
    { code: 'et', name: 'eesti' },
    { code: 'es', name: 'Español' },
    { code: 'fr', name: 'Français' },
    { code: 'ja', name: '日本語' },
    { code: 'zh', name: '中文' }
  ]);
  const LANGUAGE_TEXT = Object.freeze({
    th: {
      help: 'ช่วยเหลือ', helpMenu: 'ความช่วยเหลือ', backToAccount: 'กลับไปยังเมนูบัญชี',
      closeShortcuts: 'ปิดหน้าต่างคีย์ลัด',
      helpCenter: 'ศูนย์ช่วยเหลือ', releaseNotes: 'บันทึกการเปลี่ยนแปลง',
      userGuide: 'คู่มือการใช้งาน', shortcuts: 'คีย์ลัด',
      terms: 'ข้อกำหนดการใช้งาน', privacyPolicy: 'นโยบายความเป็นส่วนตัว'
    },
    en: {
      help: 'Help', helpMenu: 'Help', backToAccount: 'Back to account menu',
      closeShortcuts: 'Close keyboard shortcuts',
      helpCenter: 'Help Center', releaseNotes: 'Release Notes',
      userGuide: 'User Guide', shortcuts: 'Keyboard Shortcuts',
      terms: 'Terms of Service', privacyPolicy: 'Privacy Policy'
    }
  });
  function languagePreference() {
    try {
      const saved = global.localStorage.getItem(LANGUAGE_STORAGE_KEY);
      return LANGUAGES.some(function (language) { return language.code === saved; }) ? saved : 'auto';
    } catch (error) { return 'auto'; }
  }
  function effectiveLanguage(preference) {
    const code = preference === 'auto'
      ? String(global.navigator && global.navigator.language || 'th').split('-')[0].toLowerCase()
      : preference;
    // Other languages remain selectable; untranslated UI safely falls back to Thai.
    return LANGUAGE_TEXT[code] ? code : 'th';
  }
  function applyLanguage(preference, persist) {
    const selected = LANGUAGES.some(function (language) { return language.code === preference; })
      ? preference : 'auto';
    const effective = effectiveLanguage(selected);
    if (persist) {
      try { global.localStorage.setItem(LANGUAGE_STORAGE_KEY, selected); }
      catch (error) { /* The selection remains active until reload if storage is unavailable. */ }
    }
    document.documentElement.lang = effective;
    document.documentElement.dataset.languagePreference = selected;
    document.querySelectorAll('[data-language-text]').forEach(function (element) {
      const translated = LANGUAGE_TEXT[effective][element.dataset.languageText];
      if (translated) element.textContent = translated;
    });
    document.querySelectorAll('[data-language-aria-label]').forEach(function (element) {
      const translated = LANGUAGE_TEXT[effective][element.dataset.languageAriaLabel];
      if (translated) element.setAttribute('aria-label', translated);
    });
    global.dispatchEvent(new CustomEvent('crs:language-changed', {
      detail: { preference: selected, effective: effective }
    }));
  }
  CRS.language = Object.freeze({
    options: LANGUAGES,
    current: function () { return document.documentElement.dataset.languagePreference || languagePreference(); },
    effective: function () { return effectiveLanguage(this.current()); },
    set: function (code) { applyLanguage(code, true); }
  });
  applyLanguage(languagePreference(), false);
  global.addEventListener('languagechange', function () {
    if (CRS.language.current() === 'auto') applyLanguage('auto', false);
  });
  const routeTitles = {
    dashboard: 'หน้าหลัก',
    equipment: 'อุปกรณ์',
    'equipment-detail': 'รายละเอียดอุปกรณ์',
    borrow: 'ขอยืมอุปกรณ์',
    'my-borrow': 'การยืมของฉัน',
    history: 'ประวัติของฉัน',
    admin: 'จัดการระบบ',
    scan: 'สแกน QR',
    account: 'บัญชีของฉัน',
    settings: 'การตั้งค่า'
  };
  const statusMeta = {
    AVAILABLE: ['พร้อมยืม', 'success'],
    PENDING: ['รออนุมัติ', 'warning'],
    RESERVED: ['ถูกจอง', 'info'],
    BORROWED: ['กำลังยืม', 'primary'],
    RETURNING: ['รอตรวจรับคืน', 'warning'],
    MAINTENANCE: ['ส่งซ่อม', 'secondary'],
    DAMAGED: ['ชำรุด', 'danger'],
    LOST: ['สูญหาย', 'dark'],
    RETIRED: ['ยกเลิกใช้งาน', 'secondary'],
    DELETED: ['ลบแล้ว', 'secondary'],
    PENDING_APPROVAL: ['รออนุมัติ', 'warning'],
    APPROVED: ['อนุมัติแล้ว', 'info'],
    REJECTED: ['ถูกปฏิเสธ', 'danger'],
    CHECKED_OUT: ['กำลังยืม', 'primary'],
    RETURN_REQUESTED: ['รอตรวจรับคืน', 'warning'],
    RETURNED: ['คืนแล้ว', 'success'],
    CANCELLED: ['ยกเลิก', 'secondary'],
    OVERDUE: ['เกินกำหนด', 'danger'],
    NORMAL: ['ปกติ', 'success'],
    COSMETIC_DAMAGE: ['มีรอย/เสียหายเล็กน้อย', 'warning'],
    MISSING_ITEMS: ['อุปกรณ์ไม่ครบ', 'danger'],
    ACTIVE: ['ใช้งาน', 'success'],
    INACTIVE: ['ปิดใช้งาน', 'secondary'],
    USER: ['ผู้ใช้งาน', 'primary'],
    ADMIN: ['ผู้ดูแลระบบ', 'dark'],
    STARTED: ['ต้องกู้คืน', 'warning'],
    COMPLETED: ['เสร็จสมบูรณ์', 'success'],
    ABORTED: ['ยกเลิกอย่างปลอดภัย', 'secondary']
  };
  const actionLabels = {
    CREATE_ASSET: 'เพิ่มอุปกรณ์',
    DELETE_ASSET: 'ลบอุปกรณ์',
    EDIT_ASSET: 'แก้ไขอุปกรณ์',
    CHANGE_STATUS: 'เปลี่ยนสถานะ',
    UPLOAD_ASSET_IMAGE: 'อัปโหลดรูปอุปกรณ์',
    BORROW_REQUEST: 'ส่งคำขอยืม',
    APPROVE: 'อนุมัติการยืม',
    REJECT: 'ไม่อนุมัติการยืม',
    CHECKOUT: 'จ่ายอุปกรณ์',
    REQUEST_RETURN: 'แจ้งคืนอุปกรณ์',
    RETURN: 'ตรวจรับคืน',
    CREATE_USER: 'เพิ่มผู้ใช้',
    EDIT_USER: 'แก้ไขผู้ใช้',
    AUTO_PROVISION_USER: 'สร้างผู้ใช้อัตโนมัติ',
    CREATE_CATEGORY: 'เพิ่มหมวดหมู่',
    EDIT_CATEGORY: 'แก้ไขหมวดหมู่'
  };

  CRS.state = {
    bootstrap: null,
    route: '',
    params: {},
    viewToken: 0,
    loadingCount: 0,
    routeCleanup: null
  };
  CRS.routes = Object.create(null);

  CRS.$ = function (selector, root) {
    return (root || document).querySelector(selector);
  };

  CRS.$$ = function (selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  };

  CRS.escapeHtml = function (value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  };

  CRS.safeImageUrl = function (value) {
    const url = String(value || '').trim();
    return /^https:\/\/drive\.google\.com\/thumbnail\?/i.test(url) ? url : '';
  };

  const imageRequestQueue = [];
  const pendingImageRequests = new Map();
  const imageObjectUrls = new WeakMap();
  let activeImageRequests = 0;
  let imageRequestSerial = 0;

  function pumpImageRequests() {
    while (activeImageRequests < 3 && imageRequestQueue.length) {
      const request = imageRequestQueue.shift();
      activeImageRequests += 1;
      CRS.api.getEquipmentImage(request.assetId, request.version).then(
        request.resolve, request.reject
      ).then(function () {
        activeImageRequests -= 1;
        pumpImageRequests();
      }, function () {
        activeImageRequests -= 1;
        pumpImageRequests();
      });
    }
  }

  function fetchEquipmentImage(assetId, version) {
    const key = assetId + ':' + version;
    if (pendingImageRequests.has(key)) return pendingImageRequests.get(key);
    const promise = new Promise(function (resolve, reject) {
      imageRequestQueue.push({ assetId: assetId, version: version, resolve: resolve, reject: reject });
      pumpImageRequests();
    });
    pendingImageRequests.set(key, promise);
    promise.then(function () { pendingImageRequests.delete(key); },
      function () { pendingImageRequests.delete(key); });
    return promise;
  }

  CRS.cancelEquipmentImage = function (image) {
    if (!image) return;
    image.dataset.imageRequestSerial = String(++imageRequestSerial);
    const objectUrl = imageObjectUrls.get(image);
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    imageObjectUrls.delete(image);
  };

  CRS.recoverEquipmentImage = async function (image, fallback, record) {
    if (!image || !record || !/^AST-\d{6}$/.test(String(record.asset_id || '')) ||
      !Number.isSafeInteger(Number(record.row_version))) return;
    CRS.cancelEquipmentImage(image);
    const serial = image.dataset.imageRequestSerial;
    const version = Number(record.row_version);
    try {
      const result = await fetchEquipmentImage(record.asset_id, version);
      if (!image.isConnected || image.dataset.imageRequestSerial !== serial ||
        !result || result.available !== true || Number(result.row_version) !== version ||
        !/^(image\/jpeg|image\/png|image\/webp|image\/gif)$/.test(result.mime_type) ||
        !/^[A-Za-z0-9+/]+={0,2}$/.test(result.base64_data || '') ||
        result.base64_data.length > 14 * 1024 * 1024) return;
      const binary = atob(result.base64_data);
      const bytes = Uint8Array.from(binary, function (character) { return character.charCodeAt(0); });
      const objectUrl = URL.createObjectURL(new Blob([bytes], { type: result.mime_type }));
      imageObjectUrls.set(image, objectUrl);
      function releaseObjectUrl() {
        URL.revokeObjectURL(objectUrl);
        if (imageObjectUrls.get(image) === objectUrl) imageObjectUrls.delete(image);
      }
      image.onload = function () {
        releaseObjectUrl();
        image.hidden = false;
        image.classList.remove('d-none', 'opacity-0');
        if (fallback) { fallback.hidden = true; fallback.classList.add('d-none'); }
      };
      image.onerror = function () {
        releaseObjectUrl();
        image.removeAttribute('src');
        image.hidden = true;
        image.classList.add('d-none');
        if (fallback) { fallback.hidden = false; fallback.classList.remove('d-none'); }
      };
      image.loading = 'eager';
      image.hidden = false;
      image.classList.remove('d-none');
      image.classList.add('opacity-0');
      image.src = objectUrl;
    } catch (ignored) {
      // A failed protected read keeps the standard image placeholder visible.
    }
  };

  CRS.setText = function (target, value) {
    const element = typeof target === 'string' ? CRS.$(target) : target;
    if (element) element.textContent = value === undefined || value === null ? '' : String(value);
  };

  CRS.formatDate = function (value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
    if (!match) return value ? String(value) : '—';
    const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
    return new Intl.DateTimeFormat('th-TH', {
      day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'
    }).format(date);
  };

  CRS.formatDateTime = function (value) {
    if (!value) return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    return new Intl.DateTimeFormat('th-TH', {
      day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
      timeZone: (CRS.state.bootstrap && CRS.state.bootstrap.app.timezone) || 'Asia/Bangkok'
    }).format(date);
  };

  CRS.formatMoney = function (value) {
    if (value === '' || value === null || value === undefined) return '—';
    const number = Number(value);
    return Number.isFinite(number)
      ? new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(number)
      : '—';
  };

  CRS.statusLabel = function (status) {
    const key = String(status || '').toUpperCase();
    return statusMeta[key] ? statusMeta[key][0] : (key || 'ไม่ระบุ');
  };

  CRS.statusBadge = function (status) {
    const key = String(status || '').toUpperCase();
    const meta = statusMeta[key] || [key || 'ไม่ระบุ', 'secondary'];
    return '<span class="badge rounded-pill text-bg-' + meta[1] + '">' +
      CRS.escapeHtml(meta[0]) + '</span>';
  };

  CRS.actionLabel = function (action) {
    const key = String(action || '').toUpperCase();
    return actionLabels[key] || key || 'ไม่ระบุ';
  };

  CRS.commandId = function () {
    if (global.crypto && typeof global.crypto.randomUUID === 'function') {
      return global.crypto.randomUUID();
    }
    const bytes = new Uint8Array(16);
    if (global.crypto && typeof global.crypto.getRandomValues === 'function') {
      global.crypto.getRandomValues(bytes);
      return Array.prototype.map.call(bytes, function (byte) {
        return byte.toString(16).padStart(2, '0');
      }).join('');
    }
    return 'cmd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 14);
  };

  function canonicalize(value) {
    if (Array.isArray(value)) return value.map(canonicalize);
    if (value && typeof value === 'object') {
      const output = {};
      Object.keys(value).sort().forEach(function (key) { output[key] = canonicalize(value[key]); });
      return output;
    }
    return value === undefined ? null : value;
  }

  function fingerprint(value) {
    const text = JSON.stringify(canonicalize(value));
    let hash = 2166136261;
    for (let index = 0; index < text.length; index += 1) {
      hash ^= text.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(36) + ':' + text.length;
  }

  const commandStoreKey = 'crs.pendingCommands.v1';
  const definitivePrestartErrors = [
    'VALIDATION_FAILED', 'UNAUTHENTICATED', 'FORBIDDEN', 'USER_DISABLED', 'CONFIG_ERROR',
    'NOT_FOUND', 'DUPLICATE_SERIAL', 'DUPLICATE_EMAIL', 'DUPLICATE_CATEGORY',
    'LAST_ACTIVE_ADMIN', 'RESERVATION_CONFLICT'
  ];

  function readCommands() {
    try { return JSON.parse(sessionStorage.getItem(commandStoreKey) || '{}'); }
    catch (error) { return {}; }
  }

  function writeCommands(commands) {
    try { sessionStorage.setItem(commandStoreKey, JSON.stringify(commands)); }
    catch (error) { console.warn('Pending command storage unavailable', error); }
  }

  CRS.runMutation = async function (key, method, payload) {
    const commands = readCommands();
    const payloadFingerprint = fingerprint(payload || {});
    let entry = commands[key];
    if (entry && entry.fingerprint !== payloadFingerprint) {
      if (entry.locked) {
        throw new CRS.ClientApiError({
          code: 'PENDING_COMMAND_CHANGED',
          message: 'ข้อมูลของรายการที่ต้องกู้คืนเปลี่ยนไป กรุณาโหลดหน้านี้ใหม่แล้วทำรายการเดิมให้เสร็จ',
          retryable: false
        });
      }
      entry = null;
    }
    if (!entry) {
      entry = { commandId: CRS.commandId(), fingerprint: payloadFingerprint, locked: false };
      commands[key] = entry;
      writeCommands(commands);
    }
    try {
      const result = await CRS.api[method](Object.assign({}, payload, {
        command_id: entry.commandId
      }));
      const afterSuccess = readCommands();
      delete afterSuccess[key];
      writeCommands(afterSuccess);
      return result;
    } catch (error) {
      const afterError = readCommands();
      if (definitivePrestartErrors.indexOf(error.code) !== -1 ||
          (error.code === 'DRIVE_SHARING_FAILED' && error.retryable === false)) {
        delete afterError[key];
      } else if (afterError[key]) {
        afterError[key].locked = true;
      }
      writeCommands(afterError);
      throw error;
    }
  };

  CRS.clearPendingCommand = function (key) {
    const commands = readCommands();
    delete commands[key];
    writeCommands(commands);
  };

    CRS.setText(CRS.$('[data-loading-message]', overlay), message || 'กำลังประมวลผล…');
    overlay.hidden = CRS.state.loadingCount === 0;
    overlay.setAttribute('aria-hidden', CRS.state.loadingCount === 0 ? 'true' : 'false');

    const container = CRS.$('#toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    const color = ['success', 'danger', 'warning', 'info'].indexOf(tone) !== -1 ? tone : 'info';
    toast.className = 'toast align-items-center border-0 text-bg-' + color;
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.setAttribute('aria-atomic', 'true');
    const row = document.createElement('div');
    row.className = 'd-flex';
    const body = document.createElement('div');
    body.className = 'toast-body';

    close.className = 'btn-close btn-close-white me-2 m-auto';
    close.setAttribute('data-bs-dismiss', 'toast');
    close.setAttribute('aria-label', 'ปิด');
    row.append(body, close);
    toast.appendChild(row);
    container.appendChild(toast);
    toast.addEventListener('hidden.bs.toast', function () { toast.remove(); });
    bootstrap.Toast.getOrCreateInstance(toast, { delay: color === 'danger' ? 7000 : 4000 }).show();

  CRS.clearFieldErrors = function (form) {
    if (!form) return;
    CRS.$$('.is-invalid', form).forEach(function (field) { field.classList.remove('is-invalid'); });
    CRS.$$('.invalid-feedback[data-server-error]', form).forEach(function (feedback) {
      feedback.remove();
    });
  };

  CRS.applyFieldErrors = function (form, fieldErrors) {
    if (!form || !fieldErrors) return;
    Object.keys(fieldErrors).forEach(function (name) {
      let field = form.elements.namedItem(name);
      if (!field && name.indexOf('.') !== -1) {
        field = form.elements.namedItem(name.replace(/\.(\d+)\./g, '[$1].'));
      }
      if (!field || field instanceof RadioNodeList) return;
      field.classList.add('is-invalid');
      const feedback = document.createElement('div');
      feedback.className = 'invalid-feedback';
      feedback.dataset.serverError = 'true';
      feedback.textContent = fieldErrors[name];
      field.insertAdjacentElement('afterend', feedback);
    });
  };

  CRS.handleError = function (error, options) {
    const settings = options || {};

    if (settings.form) {
      CRS.clearFieldErrors(settings.form);
      CRS.applyFieldErrors(settings.form, error && error.fieldErrors);
    }
    const suffix = error && error.requestId ? ' (รหัสอ้างอิง ' + error.requestId + ')' : '';

    CRS.setText(CRS.$('[data-confirm-title]', modalElement), settings.title || 'ยืนยันรายการ');
    CRS.setText(CRS.$('[data-confirm-message]', modalElement), settings.message || 'ยืนยันรายการนี้?');

    confirmButton.className = 'btn btn-' + (settings.tone || 'primary');
    confirmButton.textContent = settings.confirmText || 'ยืนยัน';
    const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
    return new Promise(function (resolve) {
      let accepted = false;
      function accept() {
        accepted = true;
        modal.hide();

        confirmButton.removeEventListener('click', accept);
        modalElement.removeEventListener('hidden.bs.modal', finish);

  CRS.pagination = function (pageInfo, action) {
    const current = Number(pageInfo.page || 1);
    const totalPages = Number(pageInfo.totalPages || 1);
    const dataAction = CRS.escapeHtml(action || 'page');
    const previousDisabled = current <= 1 ? ' disabled aria-disabled="true"' : '';
    const nextDisabled = current >= totalPages ? ' disabled aria-disabled="true"' : '';
    return '<nav aria-label="เปลี่ยนหน้า"><div class="d-flex align-items-center justify-content-between gap-3">' +
      '<small class="text-secondary">หน้า ' + current + ' จาก ' + totalPages +

      '<div class="btn-group btn-group-sm">' +
      '<button type="button" class="btn btn-outline-secondary" data-action="' + dataAction +
      '" data-page="' + (current - 1) + '"' + previousDisabled + '>ก่อนหน้า</button>' +
      '<button type="button" class="btn btn-outline-secondary" data-action="' + dataAction +
      '" data-page="' + (current + 1) + '"' + nextDisabled + '>ถัดไป</button>' +
      '</div></div></nav>';
  };

  CRS.paginationItems = function (pageInfo, action) {
    const current = Number(pageInfo.page || 1);
    const totalPages = Number(pageInfo.totalPages || 1);
    const dataAction = CRS.escapeHtml(action || 'page');
    const item = function (label, page, disabled, active) {
      return '<li class="page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : '') + '">' +
        '<button type="button" class="page-link" data-action="' + dataAction + '" data-page="' + page + '"' +
        (disabled ? ' disabled aria-disabled="true"' : '') + (active ? ' aria-current="page"' : '') + '>' +
        CRS.escapeHtml(label) + '</button></li>';
    };
    let html = item('ก่อนหน้า', Math.max(1, current - 1), current <= 1, false);
    const start = Math.max(1, Math.min(current - 2, totalPages - 4));
    const end = Math.min(totalPages, start + 4);
    for (let page = start; page <= end; page += 1) {
      html += item(String(page), page, false, page === current);
    }
    html += item('ถัดไป', Math.min(totalPages, current + 1), current >= totalPages, false);
    return html;
  };

    const cleanup = CRS.state.routeCleanup;
    CRS.state.routeCleanup = null;
    if (!cleanup) return;
    try { await cleanup(); }
    catch (error) { console.warn('Route cleanup failed', error); }
  }

  function normalizeRoute(route, params) {
    let name = String(route || '').replace(/^#/, '').trim().toLowerCase();
    const normalizedParams = Object.assign({}, params || {});
    if (!name && normalizedParams.id) name = 'equipment-detail';
    if (!name) name = 'dashboard';
    if (name === 'equipment-detail' && !normalizedParams.id && normalizedParams.asset_id) {
      normalizedParams.id = normalizedParams.asset_id;
    }
    return { name: name, params: normalizedParams };
  }

  CRS.navigate = function (route, params, replace) {
    const target = normalizeRoute(route, params);
    const historyParams = Object.assign({}, target.params, { view: target.name });
    if (global.google && google.script && google.script.history) {
      const method = replace ? 'replace' : 'push';
      google.script.history[method]({ route: target.name }, historyParams, target.name);
      CRS.renderRoute(target.name, target.params);
      return;
    }
    const query = new URLSearchParams(historyParams).toString();
    global.location.hash = target.name + (query ? '?' + query : '');
  };

  function syncNavigationLinks(root) {
    const configured = CRS.state.bootstrap && CRS.state.bootstrap.app.webAppUrl;
    const base = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/
      .test(String(configured || '')) ? configured : '';
    CRS.$$('a[data-route]', root).forEach(function (link) {
      if (base) {
        link.href = base + '?view=' + encodeURIComponent(link.dataset.route);
        link.removeAttribute('tabindex');
      } else {
        link.removeAttribute('href');
        link.tabIndex = 0;
      }
    });
  }

  function applyActiveNavigation(route) {
    const shell = CRS.$('#app-shell');
    if (shell) shell.classList.toggle('is-settings-route', route === 'settings');
    const primary = ['equipment-detail', 'borrow'].indexOf(route) !== -1
      ? 'equipment'
      : (route === 'history' ? 'history' : route);
    CRS.$$('[data-route]').forEach(function (link) {
      const active = link.dataset.route === primary;
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
    CRS.setText('#page-title', routeTitles[route] || 'ระบบยืม–คืนอุปกรณ์');
    document.title = (routeTitles[route] || 'ระบบยืม–คืนอุปกรณ์') + ' · ' +

  CRS.renderRoute = async function (route, params) {
    const target = normalizeRoute(route, params);
    if(CRS.state.bootstrap && CRS.state.bootstrap.session.mustChangePassword) {
      target.name='settings';target.params={section:'security'};
    }
    if (target.name === 'admin' && !(CRS.state.bootstrap && CRS.state.bootstrap.session.isAdmin)) {
      CRS.toast('เฉพาะผู้ดูแลระบบเท่านั้นที่เปิดหน้านี้ได้', 'danger');
      CRS.navigate('dashboard', {}, true);
      return;
    }
    const renderer = CRS.routes[target.name];
    if (!renderer) {
      CRS.navigate('dashboard', {}, true);
      return;
    }
    await cleanupCurrentRoute();
    CRS.state.route = target.name;
    CRS.state.params = target.params;
    const token = ++CRS.state.viewToken;
    applyActiveNavigation(target.name);
    const root = CRS.$('#view-root');

    try {

        ? '<div class="settings-card settings-placeholder"><p>ข้อมูลบัญชีและสิทธิ์อยู่ในหน้าบัญชีของฉัน</p>' +
          '<a class="btn btn-outline-secondary" data-route="account">ไปยังบัญชีของฉัน</a></div>'
        : '<div class="settings-card settings-placeholder"><p>ยังไม่มีการตั้งค่าในส่วนนี้</p></div>';
    root.innerHTML = '<section class="settings-page' + (settingsSidebarCollapsed ? ' is-sidebar-collapsed' : '') +
      '" aria-labelledby="settings-heading">' +
      '<button class="settings-sidebar-backdrop" type="button" aria-label="ปิดเมนูการตั้งค่า" hidden></button>' +
      '<aside id="settings-sidebar" class="settings-sidebar" aria-label="เมนูการตั้งค่า">' +
      '<div class="settings-sidebar-header"><button id="settings-sidebar-toggle" class="settings-icon-button" ' +
      'type="button" aria-label="Toggle sidebar" aria-controls="settings-sidebar" ' +
      'aria-expanded="' + String(!settingsSidebarCollapsed) + '" title="Toggle sidebar">' +
      '<i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i></button></div>' +
      '<button id="settings-back-to-app" class="settings-back-button" type="button" title="Back to app">' +
      '<i class="bi bi-arrow-left" aria-hidden="true"></i><span>Back to app</span></button>' +
      '<label class="settings-nav-search"><i class="bi bi-search" aria-hidden="true"></i>' +
      '<input id="settings-nav-search" type="search" placeholder="Search" aria-label="Search settings"></label>' +
      '<nav class="settings-nav" aria-label="Settings sections"><p class="settings-nav-heading">Personal</p>' +
      SETTINGS_SECTIONS.slice(0, 6).map(navItem).join('') +
      '<div class="settings-nav-spacer"></div>' + SETTINGS_SECTIONS.slice(6).map(navItem).join('') +
      '<p class="settings-nav-empty" hidden>ไม่พบเมนูที่ค้นหา</p></nav></aside>' +
      '<div class="settings-workspace"><div class="settings-mobile-header">' +
      '<button id="settings-mobile-toggle" class="settings-icon-button" type="button" ' +
      'aria-label="เปิดเมนูการตั้งค่า" aria-controls="settings-sidebar" aria-expanded="false">' +
      '<i class="bi bi-list" aria-hidden="true"></i></button>' +
      '<span>Settings</span></div><div class="settings-content">' +
      '<h2 id="settings-heading" class="settings-heading">' +
      (sectionKey === 'keyboard' ? 'Keyboard Shortcuts' : selectedSection.label) + '</h2>' +
      (sectionKey === 'general' ? generalContent : sectionKey === 'appearance' ? appearanceContent : otherContent) +
      '</div></div></section>';

    if(CRS.features) CRS.features.mountSettings(sectionKey,root.querySelector('.settings-content'));

    const section = root.querySelector('.settings-page');
    const sidebarToggle = section.querySelector('#settings-sidebar-toggle');
    const mobileToggle = section.querySelector('#settings-mobile-toggle');
    const sidebarBackdrop = section.querySelector('.settings-sidebar-backdrop');
    const settingsSidebar = section.querySelector('#settings-sidebar');
    const navSearch = section.querySelector('#settings-nav-search');
    let removeDropdownOutside = null;
    function syncSidebarAccessibility() {
      if (global.innerWidth >= 768) {
        section.classList.remove('is-mobile-sidebar-open');
        sidebarBackdrop.hidden = true;
        mobileToggle.setAttribute('aria-expanded', 'false');
      }
      const mobile = global.innerWidth < 768;
      const open = section.classList.contains('is-mobile-sidebar-open');
      const inaccessible = mobile && !open;
      settingsSidebar.inert = inaccessible;
      if (inaccessible) settingsSidebar.setAttribute('aria-hidden', 'true');
      else settingsSidebar.removeAttribute('aria-hidden');
      sidebarToggle.setAttribute('aria-expanded', String(mobile ? open : !settingsSidebarCollapsed));
    }
    function setMobileSidebar(open) {
      section.classList.toggle('is-mobile-sidebar-open', open);
      mobileToggle.setAttribute('aria-expanded', String(open));
      sidebarBackdrop.hidden = !open;
      syncSidebarAccessibility();
      if (open) navSearch.focus();
      else mobileToggle.focus();
    }
    global.addEventListener('resize', syncSidebarAccessibility);
    syncSidebarAccessibility();
    CRS.setRouteCleanup(function () {
      global.removeEventListener('resize', syncSidebarAccessibility);
      if (removeDropdownOutside) removeDropdownOutside();
    });
    sidebarToggle.addEventListener('click', function () {
      if (global.innerWidth < 768) {
        setMobileSidebar(false);
        return;
      }
      settingsSidebarCollapsed = !settingsSidebarCollapsed;
      section.classList.toggle('is-sidebar-collapsed', settingsSidebarCollapsed);
      sidebarToggle.setAttribute('aria-expanded', String(!settingsSidebarCollapsed));
    });
    mobileToggle.addEventListener('click', function () { setMobileSidebar(true); });
    sidebarBackdrop.addEventListener('click', function () { setMobileSidebar(false); });
    section.querySelector('#settings-back-to-app').addEventListener('click', function () {
      CRS.navigate('dashboard', {});
    });
    section.querySelector('.settings-nav').addEventListener('click', function (event) {
      const item = event.target.closest('[data-settings-section]');
      if (item) CRS.navigate('settings', { section: item.dataset.settingsSection });
    });
    navSearch.addEventListener('input', function () {
      const query = navSearch.value.trim().toLocaleLowerCase();
      let count = 0;
      section.querySelectorAll('[data-settings-section]').forEach(function (item) {
        const match = item.textContent.toLocaleLowerCase().includes(query);
        item.hidden = !match;
        if (match) count += 1;
      });
      section.querySelector('.settings-nav-empty').hidden = count > 0;
    });
    section.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && section.classList.contains('is-mobile-sidebar-open')) {
        event.preventDefault();
        setMobileSidebar(false);
      }
    });
    if (sectionKey === 'appearance') {
      section.querySelectorAll('[data-settings-theme]').forEach(function (button) {
        button.setAttribute('aria-pressed', String(button.dataset.settingsTheme === CRS.theme.current()));
        button.addEventListener('click', function () {
          CRS.theme.apply(button.dataset.settingsTheme, true);
          section.querySelectorAll('[data-settings-theme]').forEach(function (choice) {
            choice.setAttribute('aria-pressed', String(choice === button));
          });
        });
      });
    }
    if (sectionKey === 'keyboard') {
      const enabled = section.querySelector('[data-settings-shortcut-enabled]');
      const key = section.querySelector('[data-settings-shortcut-key]');
      const status = section.querySelector('[data-settings-shortcut-status]');
      let recording = false;
      function syncShortcut() {
        enabled.setAttribute('aria-checked', String(CRS.sidebarShortcut.enabled()));
        key.textContent = CRS.sidebarShortcut.label();
        key.removeAttribute('aria-pressed');
        recording = false;
      }
      syncShortcut();
      enabled.addEventListener('click', function () {
        const next = !CRS.sidebarShortcut.enabled();
        CRS.sidebarShortcut.setEnabled(next);
        enabled.setAttribute('aria-checked', String(next));
      });
      key.addEventListener('click', function () {
        if (recording) { syncShortcut(); return; }
        recording = true;
        key.textContent = 'Press Key sequence';
        key.setAttribute('aria-pressed', 'true');
        status.textContent = 'กด Ctrl, Alt หรือ Meta ร่วมกับตัวอักษรหรือตัวเลข · Esc เพื่อยกเลิก';
        key.focus();
      });
      key.addEventListener('blur', function () {
        if (recording) syncShortcut();
      });
      section.addEventListener('keydown', function (event) {
        if (!recording || event.repeat) return;
        event.preventDefault();
        event.stopPropagation();
        if (['Control', 'Shift', 'Alt', 'Meta'].indexOf(event.key) !== -1) return;
        if (event.key === 'Escape') {
          syncShortcut();
          status.textContent = 'ยกเลิกการเปลี่ยนคีย์ลัด';
          return;
        }
        if (!CRS.sidebarShortcut.setBinding({
          ctrl: event.ctrlKey, shift: event.shiftKey, alt: event.altKey,
          meta: event.metaKey, code: event.code
        })) {
          status.textContent = 'โปรดกด Ctrl, Alt หรือ Meta ร่วมกับตัวอักษรหรือตัวเลข';
          return;
        }
        syncShortcut();
        status.textContent = 'บันทึกคีย์ลัด Sidebar แล้ว';
      }, true);
      section.querySelector('[data-settings-shortcut-restore]').addEventListener('click', function () {
        CRS.sidebarShortcut.setEnabled(true);
        CRS.sidebarShortcut.resetBinding();
        syncShortcut();
        status.textContent = 'คืนค่าเริ่มต้นแล้ว';
      });
    }
    if (sectionKey !== 'general') return;
    const trigger = section.querySelector('#language-trigger');
    const dropdown = section.querySelector('#language-dropdown');
    const search = section.querySelector('#language-search');
    const list = section.querySelector('#language-list');
    const empty = section.querySelector('.settings-language-empty');
    const note = section.querySelector('.settings-language-note');
    const options = CRS.language.options;

    function updateSelection() {
      const selected = CRS.language.current();
      const language = options.find(function (item) { return item.code === selected; }) || options[0];
      trigger.querySelector('[data-selected-language]').textContent = language.name;
      note.hidden = selected === 'auto' || selected === 'th' || selected === 'en';
      list.querySelectorAll('[data-language-code]').forEach(function (option) {
        option.setAttribute('aria-selected', String(option.dataset.languageCode === selected));
      });
    }
    function renderOptions() {
      const query = search.value.trim().toLocaleLowerCase();
      list.replaceChildren();
      const matches = options.filter(function (item) {
        return item.name.toLocaleLowerCase().includes(query) || item.code.includes(query);
      }).sort(function (a, b) {
        if (a.code === 'auto') return -1;
        if (b.code === 'auto') return 1;
        return a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });
      });
      matches.forEach(function (item) {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'settings-language-option';
        option.dataset.languageCode = item.code;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', String(item.code === CRS.language.current()));
        option.textContent = item.name;
        const check = document.createElement('i');
        check.className = 'bi bi-check-lg';
        check.setAttribute('aria-hidden', 'true');
        option.append(check);
        list.append(option);
      });
      empty.hidden = matches.length > 0;
    }
    function closeDropdown(restoreFocus) {
      if (dropdown.hidden) return;
      dropdown.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
      if (restoreFocus) trigger.focus();
    }
    trigger.addEventListener('click', function () {
      const opening = dropdown.hidden;
      dropdown.hidden = !opening;
      trigger.setAttribute('aria-expanded', String(opening));
      if (opening) {
        search.value = '';
        renderOptions();
        search.focus();
      }
    });
    search.addEventListener('input', renderOptions);
    list.addEventListener('click', function (event) {
      const option = event.target.closest('[data-language-code]');
      if (!option) return;
      CRS.language.set(option.dataset.languageCode);
      updateSelection();
      closeDropdown(true);
    });
    section.addEventListener('keydown', function (event) {
      if (dropdown.hidden) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDropdown(true);
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const choices = Array.from(list.querySelectorAll('[data-language-code]'));
        if (!choices.length) return;
        event.preventDefault();
        const current = choices.indexOf(document.activeElement);
        const next = event.key === 'ArrowDown'
          ? (current + 1) % choices.length
          : (current < 0 ? choices.length - 1 : (current - 1 + choices.length) % choices.length);
        choices[next].focus();
        choices[next].scrollIntoView({ block: 'nearest' });
      }
    });
    function closeOnOutsideClick(event) {
      if (!dropdown.contains(event.target) && !trigger.contains(event.target)) closeDropdown(false);
    }
    document.addEventListener('click', closeOnOutsideClick);
    removeDropdownOutside = function () { document.removeEventListener('click', closeOnOutsideClick); };
    updateSelection();
  }

  CRS.registerRoute('settings', renderSettings);

  function updateNetworkStatus() {
    const indicator = CRS.$('#network-status');
    if (!indicator) return;
    const offline = global.navigator && global.navigator.onLine === false;
    indicator.hidden = !offline;
  }

  function applyBootstrap(data) {
    CRS.state.bootstrap = data;
    syncNavigationLinks(document);
    CRS.$$('[data-app-short-name]').forEach(function (node) {
      node.textContent = data.app.shortName || 'CRS Yuem-Kuen';
    });
    CRS.$$('[data-app-version]').forEach(function (node) { node.textContent = data.app.version; });
    CRS.$$('[data-session-name]').forEach(function (node) {
      node.textContent = data.session.name || data.session.email;
    });
    CRS.$$('[data-session-email]').forEach(function (node) { node.textContent = data.session.email; });
    CRS.$$('[data-session-department]').forEach(function (node) {
      node.textContent = data.session.department || 'ไม่ระบุหน่วยงาน';
    });
    CRS.$$('[data-session-role]').forEach(function (node) {
      node.textContent = CRS.statusLabel(data.session.role);
    });
    CRS.$$('[data-session-initial]').forEach(function (node) {
      node.textContent = (data.session.name || data.session.email || '?').slice(0, 1).toUpperCase();
    });
    CRS.$$('[data-admin-only]').forEach(function (node) { node.hidden = !data.session.isAdmin; });
    const shell = CRS.$('#app-shell');
    const splash = CRS.$('#app-splash');
    const access = CRS.$('#access-state');
    if (splash) splash.hidden = true;
    if (access) access.hidden = true;
    if (shell) shell.hidden = false;
    global.dispatchEvent(new CustomEvent('crs:bootstrapped',{detail:data}));
  }

  function locationTarget(location) {
    const source = location || {};
    const params = Object.assign({}, source.parameter || {});
    let route = params.view || (source.state && source.state.route) || source.hash || '';
    if (!route && params.id) route = 'equipment-detail';
    return normalizeRoute(route, params);
  }

  function getInitialLocation() {
    return new Promise(function (resolve) {
      if (global.google && google.script && google.script.url) {
        google.script.url.getLocation(resolve);
        return;
      }
      const raw = global.location.hash.replace(/^#/, '');
      const parts = raw.split('?');
      resolve({ hash: parts[0], parameter: Object.fromEntries(new URLSearchParams(parts[1] || '')) });
    });
  }

  function showAccessError(error) {
    const splash = CRS.$('#app-splash');
    const shell = CRS.$('#app-shell');
    const access = CRS.$('#access-state');
    if (splash) splash.hidden = true;
    if (shell) shell.hidden = true;
    if (!access) return;
    access.hidden = false;
    CRS.setText(CRS.$('[data-access-title]', access),
      error.code === 'USER_DISABLED' ? 'บัญชีถูกปิดใช้งาน' : 'ไม่สามารถเข้าใช้งานระบบ');
    CRS.setText(CRS.$('[data-access-message]', access), error.message);
    CRS.setText(CRS.$('[data-access-request-id]', access), error.requestId ? 'รหัสอ้างอิง: ' + error.requestId : '');
  }

  async function bootstrapApplication() {
    initializeDesktopSidebar();
    const splash = CRS.$('#app-splash');
    const access = CRS.$('#access-state');
    if (splash) splash.hidden = false;
    if (access) access.hidden = true;
    try {
      const data = await CRS.api.getAppBootstrap();
      applyBootstrap(data);
      const location = await getInitialLocation();
      const target = CRS.features && CRS.features.loginTarget() || locationTarget(location);
      CRS.renderRoute(target.name, target.params);
    } catch (error) {
      if (error && error.code === 'UNAUTHENTICATED' && CRS.auth &&
        typeof CRS.auth.showGoogleSignIn === 'function') {
        CRS.auth.showGoogleSignIn(error.message);
      } else {
        showAccessError(error);
      }
      console.error(error);
    }
  }

  document.addEventListener('click', function (event) {
    const themeToggle = event.target.closest('[data-action="theme-toggle"]');
    if (themeToggle) cycleTheme();
    const sidebarToggle = event.target.closest('[data-action="sidebar-toggle"]');
    if (sidebarToggle) toggleDesktopSidebar();
    const routeLink = event.target.closest('[data-route]');
    if (routeLink) {
      event.preventDefault();
      CRS.navigate(routeLink.dataset.route, {});
    }
    const signOut = event.target.closest('[data-action="sign-out"]');
    if (signOut && CRS.auth && typeof CRS.auth.signOut === 'function') CRS.auth.signOut();
  });

  document.addEventListener('keydown', function (event) {
    const routeLink = event.target.closest && event.target.closest('a[data-route]:not([href])');
    if (routeLink && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      routeLink.click();
      return;
    }
    if (event.ctrlKey !== sidebarBinding.ctrl || event.shiftKey !== sidebarBinding.shift ||
      event.altKey !== sidebarBinding.alt || event.metaKey !== sidebarBinding.meta ||
      event.code !== sidebarBinding.code) return;
    if (!CRS.sidebarShortcut.enabled()) return;
    const target = event.target;
    if (target && (target.isContentEditable ||
      (typeof target.closest === 'function' && target.closest('input, textarea, select, [contenteditable="true"]')))) return;
    const shell = document.getElementById('app-shell');
    if (!shell || shell.hidden || !isDesktopViewport()) return;
    event.preventDefault();
    toggleDesktopSidebar();
  });

  if (global.google && google.script && google.script.history) {
    google.script.history.setChangeHandler(function (event) {
      const target = locationTarget(Object.assign({}, event.location || {}, { state: event.state }));
      CRS.renderRoute(target.name, target.params);
    });
  } else {
    global.addEventListener('hashchange', async function () {
      const target = locationTarget(await getInitialLocation());
      CRS.renderRoute(target.name, target.params);
    });
  }

  document.addEventListener('DOMContentLoaded', bootstrapApplication);
  global.addEventListener('crs:authentication-required', bootstrapApplication);
  global.addEventListener('online', updateNetworkStatus);
  global.addEventListener('offline', updateNetworkStatus);
  document.addEventListener('DOMContentLoaded', updateNetworkStatus);
})(window);
</script>
